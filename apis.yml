name: Wanted
description: 'Wanted was a talent-sourcing recruitment marketplace, backed by Partech and
  founded by Jean Meyer, that set out to disrupt traditional headhunting by connecting companies
  with candidates surfaced and referred through a networked marketplace. It operated out of
  New York and France under the Applicative SaaS / HR-tech category. The company has since
  wound down: its team was acqui-hired by Revolut, and the product and website at getwanted.com
  are no longer live (the domain is now parked and listed for sale on HugeDomains). No public
  API, developer portal, SDKs, or documentation could be found for this provider. This profile
  is retained as a historical company record; there is no live API surface to enrich.'
